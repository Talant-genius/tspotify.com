<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSOTIFY | Тіркелу</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #121212, #1db954);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background-color: rgba(0, 0, 0, 0.8);
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
      width: 350px;
      text-align: center;
    }
    h1 {
      color: #1db954;
      margin-bottom: 25px;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }
    input:focus {
      outline: 2px solid #1db954;
    }
    button {
      background-color: #1db954;
      color: black;
      border: none;
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: 0.3s;
      font-weight: bold;
    }
    button:hover {
      background-color: #17a84b;
      transform: scale(1.05);
    }
    p {
      margin-top: 15px;
      font-size: 14px;
    }
    a {
      color: #1db954;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>TSOTIFY</h1>
    <form id="registerForm">
      <input type="text" id="name" placeholder="Атыңды енгіз" required><br>
      <input type="email" id="email" placeholder="Email енгіз" required><br>
      <input type="password" id="password" placeholder="Құпиясөз енгіз" required><br>
      <button type="submit">Тіркелу</button>
    </form>
    <p>Аккаунтың бар ма? <a href="login.html">Кіру</a></p>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!name || !email || !password) {
        alert("Барлық өрістерді толтырыңыз!");
        return;
      }

      
      const user = { name, email, password };
      localStorage.setItem('tsotifyUser', JSON.stringify(user));

      alert("Тіркелу сәтті аяқталды!");
      window.location.href = "index.html";
    });
  </script>

</body>
</html>
